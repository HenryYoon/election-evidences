# 운영 사이트 검색·AI 도달 점검(0002 명세 7장). 주 1회와 수동 실행.
# PR CI와 별개다. 필수 검사로 지정하지 않는다. 머지를 막지 않는다.
# - 회수 점검(우리 규칙)은 어기면 이 작업이 실패로 표시된다.
# - Lighthouse, agentic-seo 점수는 표로만 남기고, 기준보다 떨어지면 경고만 낸다.
name: Reach

on:
  schedule:
    - cron: '17 0 * * 1' # 매주 월요일 09:17 KST
  workflow_dispatch:
    inputs:
      site:
        description: 점검할 사이트 주소
        required: false

permissions:
  contents: read

env:
  SITE: ${{ inputs.site || 'https://election-evidences.vercel.app' }}

jobs:
  live:
    name: 운영 사이트 회수 점검
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/reach/check-live.mjs "$SITE"

  scores:
    name: Lighthouse·agentic-seo 점수
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      # 측정 기록을 reach-history 브랜치에 쌓는다. main에는 쓰지 않는다.
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 측정할 상세 주소 고르기
        run: |
          DETAIL=$(curl -sf "$SITE/sitemap.xml" | grep -o '<loc>[^<]*/e/[^<]*</loc>' | head -1 | sed 's/<[^>]*>//g')
          echo "DETAIL=$DETAIL" >> "$GITHUB_ENV"
      - name: Lighthouse
        run: |
          mkdir -p reach-out
          i=0
          for url in "$SITE/" "$SITE/records" "$DETAIL"; do
            i=$((i+1))
            npx -y lighthouse@12.8.2 "$url" --quiet --output=json --output-path="reach-out/lh-$i.json" \
              --only-categories=performance,accessibility,best-practices,seo \
              --chrome-flags="--headless=new --no-sandbox" || echo "::warning::Lighthouse 실패: $url"
          done
      - name: agentic-seo
        # 주 지표: 운영 사이트를 내려받아 폴더 모드로 감사한다.
        # 참고: URL 모드. 원격 파일 점검 3개만 하고 페이지 점검 5개(60점)는 0점이 된다(agentic-seo 1.0.0).
        run: |
          node scripts/reach/mirror-live.mjs "$SITE" live-mirror
          npx -y agentic-seo@1.0.0 --output-dir live-mirror --json > reach-out/agentic-seo.json || true
          mkdir -p empty && cd empty && npx -y agentic-seo@1.0.0 --url "$SITE" --json > ../reach-out/agentic-seo-url.json || true
      - name: 측정 기록 가져오기
        run: |
          if git fetch --depth=1 origin reach-history 2>/dev/null; then
            git show FETCH_HEAD:history.json > history.json
          else
            echo "reach-history 브랜치가 없어 초기 기록(history-seed.json)으로 시작한다"
          fi
      - name: 요약
        # 기준은 최근 4회 평균. 이번 회차를 history.json에 덧붙인다.
        run: node scripts/reach/report-scores.mjs reach-out history.json
      - name: 측정 기록 저장
        if: github.ref == 'refs/heads/main'
        run: |
          [ -f history.json ] || exit 0
          cp history.json reach-out/history.json
          dir=$(mktemp -d)
          cp history.json "$dir/history.json"
          cd "$dir"
          git init -q -b reach-history
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          git commit -q -m "측정 기록 ${GITHUB_RUN_ID}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" reach-history
      - uses: actions/upload-artifact@v4
        with:
          name: reach-${{ github.run_id }}
          path: reach-out/
          retention-days: 30
