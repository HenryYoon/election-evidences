# 0009: 옛 시드니 프로젝트의 공개 데이터 행과 evidence-media 파일을 새 서울 프로젝트로 복사한다. 수동 실행만 한다.
# 필요한 Secrets: OLD_SUPABASE_URL, OLD_SUPABASE_SERVICE_KEY, NEW_SUPABASE_URL, NEW_SUPABASE_SERVICE_KEY.
# 행은 같은 id를 덮어쓰고, 파일은 같은 경로·같은 크기를 건너뛰므로 여러 번 실행해도 된다. 이전이 끝나면 이 파일과 Secrets를 지운다.
name: Copy storage

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copy:
    name: 데이터 행과 evidence-media 복사
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 행 복사(evidence, feed_sources)
        run: node scripts/migrate/copy-rows.mjs
        env:
          OLD_SUPABASE_URL: ${{ secrets.OLD_SUPABASE_URL }}
          OLD_SUPABASE_SERVICE_KEY: ${{ secrets.OLD_SUPABASE_SERVICE_KEY }}
          NEW_SUPABASE_URL: ${{ secrets.NEW_SUPABASE_URL }}
          NEW_SUPABASE_SERVICE_KEY: ${{ secrets.NEW_SUPABASE_SERVICE_KEY }}
      - name: 파일 복사(evidence-media)
        run: node scripts/migrate/copy-storage.mjs
        env:
          OLD_SUPABASE_URL: ${{ secrets.OLD_SUPABASE_URL }}
          OLD_SUPABASE_SERVICE_KEY: ${{ secrets.OLD_SUPABASE_SERVICE_KEY }}
          NEW_SUPABASE_URL: ${{ secrets.NEW_SUPABASE_URL }}
          NEW_SUPABASE_SERVICE_KEY: ${{ secrets.NEW_SUPABASE_SERVICE_KEY }}
